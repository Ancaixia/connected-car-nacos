server:
  port: ${SERVER_PORT:8080}

# 敏感配置优先从环境变量注入；默认值仅用于本地直连，生产环境请务必覆盖。
spring:
  application:
    name: query-service
  # 从 Nacos 配置中心导入 query-service.yml。
  # optional: 前缀表示配置中心不可用时不阻断启动，用本文件中的同名配置兜底。
  # 导入的配置优先级高于本文件，因此本文件里的同名项相当于默认值。
  config:
    import:
      - optional:nacos:query-service.yml
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.209}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ancaixia}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.1.84:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.1.84:8848}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    loadbalancer:
      retry:
        enabled: false
  thymeleaf:
    cache: false

logging:
  level:
    com.example.connectedcar: INFO

# OpenFeign / LoadBalancer 相关超时（避免默认 1s 不够）
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

# 内部服务调用共享密钥，需与 ingest-service 的 app.internal.token 一致。
# 为空表示不启用校验（本地裸跑）。
# 注入方式（Spring 读的是环境变量，不是 .env 文件）：
#   本地：   $env:INTERNAL_TOKEN="xxx"
#   Docker： docker-compose 的 environment / env_file 注入
#   K8s：    Secret + envFrom.secretRef
app:
  internal:
    token: ${INTERNAL_TOKEN:}
