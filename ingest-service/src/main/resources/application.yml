server:
  port: 8081

spring:
  application:
    name: ingest-service
  # 从 Nacos 配置中心导入 ingest-service.yml（optional: 表示配置中心不可用时不阻断启动）。
  # 导入的配置优先级高于本文件，本文件中的同名项作为兜底值。
  config:
    import:
      - optional:nacos:ingest-service.yml
  datasource:
    url: jdbc:h2:mem:connectedcar;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.209}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ancaixia}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.1.84:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.1.84:8848}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true

logging:
  level:
    com.example.connectedcar: INFO

# 内部服务调用共享密钥，需与 query-service 的 app.internal.token 一致。
# 为空表示不启用校验（本地裸跑）；部署时建议通过环境变量 INTERNAL_TOKEN 注入。
app:
  internal:
    token: ${INTERNAL_TOKEN:}
  simulator:
    interval-ms: 1000
  pipeline:
    window-seconds: 60
  alarm:
    speed-limit: 160.0
    fuel-low-limit: 5.0
    engine-temp-limit: 95.0
